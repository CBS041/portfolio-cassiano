pre-commit:
  commands:
    check:
      run: bun format {staged_files}
      glob: '*.{js,jsx,.mjs,ts,tsx,css,json,md}'
      stage_fixed: true

commit-msg:
  commands:
    lint:
      run: bun commitlint --edit {1}

pre-push:
  commands:
    validate:
      glob: '*.{ts,tsx}'
      run: bun typecheck
    lint:
      glob: '*.{ts,tsx}'
      run: bun lint
    test:
      glob: '*.{ts,tsx}'
      run: bun test:coverage
