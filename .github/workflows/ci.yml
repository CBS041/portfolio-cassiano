name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_URL: https://cassiano.tech
      NEXT_PUBLIC_AUTHOR_NAME: Cassiano
      NEXT_PUBLIC_AUTHOR_EMAIL: cassianobrito446@gmail.com
      NEXT_PUBLIC_AUTHOR_GITHUB: CBS041
      NEXT_PUBLIC_AUTHOR_LINKEDIN: cassiano-b-santos
      NEXT_PUBLIC_AUTHOR_WHATSAPP: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun prettier --check .

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun typecheck

      - name: Tests
        run: bun run test --runInBand

      - name: Build
        run: bun run build
